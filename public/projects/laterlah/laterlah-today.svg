<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#f5f1ea"/>
  <text x="195" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#1c1c1b">LaterLah.</text>
  <text x="20" y="115" font-family="sans-serif" font-size="14" fill="#8a857c">Good morning. A few things found their way back.</text>
  <rect x="20" y="140" width="350" height="160" rx="12" fill="#fff" stroke="#e6e0d4" stroke-width="1"/>
  <text x="36" y="165" font-family="sans-serif" font-size="11" font-weight="600" fill="#8a857c" letter-spacing="1">WORTH COMING BACK TO</text>
  <rect x="20" y="180" width="350" height="80" rx="0" fill="#eae3d9"/>
  <text x="36" y="230" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#1c1c1b">Designing Data-Intensive</text>
  <text x="36" y="250" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#1c1c1b">Applications</text>
  <text x="36" y="275" font-family="sans-serif" font-size="11" fill="#8a857c">dataintensive.net · Saved 3d ago</text>
  <rect x="20" y="320" width="350" height="180" rx="12" fill="#fff" stroke="#e6e0d4" stroke-width="1"/>
  <text x="36" y="345" font-family="sans-serif" font-size="11" font-weight="600" fill="#8a857c" letter-spacing="1">FROM A WHILE AGO</text>
  <rect x="20" y="360" width="350" height="60" rx="0" fill="#eae3d9"/>
  <text x="36" y="395" font-family="sans-serif" font-size="12" fill="#8a857c">Screenshot preview area</text>
  <text x="36" y="440" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#1c1c1b">Screenshot</text>
  <text x="36" y="458" font-family="sans-serif" font-size="11" fill="#8a857c">Saved 2mo ago</text>
  <rect x="20" y="520" width="350" height="140" rx="12" fill="#fff" stroke="#e6e0d4" stroke-width="1"/>
  <text x="36" y="550" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#1c1c1b">Random thought I wanted</text>
  <text x="36" y="570" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#1c1c1b">to remember</text>
  <text x="36" y="600" font-family="sans-serif" font-size="13" fill="#8a857c" line-height="18">Sometimes the best ideas come at the</text>
  <text x="36" y="618" font-family="sans-serif" font-size="13" fill="#8a857c" line-height="18">worst times. This is why I always keep a</text>
  <text x="36" y="636" font-family="sans-serif" font-size="13" fill="#8a857c" line-height="18">note nearby...</text>
  <circle cx="195" cy="730" r="24" fill="#eae3d9"/>
  <text x="195" y="735" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#8a857c">✓</text>
  <text x="195" y="775" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8a857c">That's enough for today.</text>
</svg>
