<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#f5f1ea"/>
  <text x="20" y="70" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#1c1c1b">Something from later.</text>
  <text x="20" y="100" font-family="sans-serif" font-size="14" fill="#8a857c">A quiet nudge, nothing urgent.</text>
  <rect x="20" y="130" width="350" height="200" rx="12" fill="#fff" stroke="#e6e0d4" stroke-width="1"/>
  <rect x="20" y="130" width="350" height="80" rx="12" fill="#eae3d9"/>
  <text x="36" y="165" font-family="sans-serif" font-size="11" font-weight="600" fill="#8a857c" letter-spacing="1">DATINTENSIVE.NET</text>
  <text x="36" y="190" font-family="Georgia,serif" font-size="16" font-weight="600" fill="#1c1c1b">Designing Data-Intensive Applications</text>
  <text x="36" y="265" font-family="sans-serif" font-size="13" fill="#8a857c" line-height="18">Data systems are becoming more</text>
  <text x="36" y="283" font-family="sans-serif" font-size="13" fill="#8a857c" line-height="18">specialised, but the fundamental</text>
  <text x="36" y="301" font-family="sans-serif" font-size="13" fill="#8a857c" line-height="18">principles remain the same...</text>
  <text x="36" y="320" font-family="sans-serif" font-size="11" fill="#8a857c">Saved 3d ago</text>
  <rect x="30" y="370" width="90" height="44" rx="10" fill="#fff" stroke="#e6e0d4" stroke-width="1"/>
  <text x="75" y="397" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a857c">Not now</text>
  <rect x="130" y="370" width="120" height="44" rx="10" fill="#fff" stroke="#e6e0d4" stroke-width="1"/>
  <text x="190" y="397" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1c1c1b">Another one</text>
  <rect x="260" y="370" width="100" height="44" rx="10" fill="#b8d0b8"/>
  <text x="310" y="397" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#1c1c1b">Open</text>
  <text x="195" y="470" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8a857c">LaterLah</text>
  <text x="195" y="490" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a857c">Save what matters. Bring it back when it's time.</text>
</svg>
