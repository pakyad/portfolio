  <text x="245" y="480" fill="#f7f5f0" font-family="monospace" font-size="12">settings</text>
  <text x="400" y="480" fill="rgba(247,245,240,.72)" font-family="monospace" font-size="11">manage_org, manage_billing</text>
  <text x="660" y="480" fill="#e8c87a" font-family="monospace" font-size="11">Admin only</text>
