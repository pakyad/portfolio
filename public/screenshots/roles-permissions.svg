  <text x="660" y="345" fill="#e8c87a" font-family="monospace" font-size="11">Admin only</text>
  <line x1="240" y1="360" x2="755" y2="360" stroke="rgba(247,245,240,.06)" stroke-width="1"/>
  <text x="245" y="390" fill="#f7f5f0" font-family="monospace" font-size="12">roles</text>
  <text x="400" y="390" fill="rgba(247,245,240,.72)" font-family="monospace" font-size="11">manage</text>
  <text x="660" y="390" fill="#e8c87a" font-family="monospace" font-size="11">Admin only</text>
  <line x1="240" y1="405" x2="755" y2="405" stroke="rgba(247,245,240,.06)" stroke-width="1"/>
  <text x="245" y="435" fill="#f7f5f0" font-family="monospace" font-size="12">reports</text>
  <text x="400" y="435" fill="rgba(247,245,240,.72)" font-family="monospace" font-size="11">view, export</text>
  <text x="660" y="435" fill="#e8c87a" font-family="monospace" font-size="11">Admin, Manager</text>
