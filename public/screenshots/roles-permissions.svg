  <rect x="40" y="295" width="155" height="1" fill="rgba(247,245,240,.1)"/>
  <text x="45" y="335" fill="#f7f5f0" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600">Viewer</text>
  <text x="45" y="353" fill="rgba(247,245,240,.55)" font-family="monospace" font-size="10">3 members</text>
  <rect x="225" y="95" width="545" height="460" fill="rgba(247,245,240,.04)" rx="6" stroke="rgba(247,245,240,.1)" stroke-width="1"/>
  <text x="245" y="125" fill="rgba(247,245,240,.55)" font-family="monospace" font-size="10">SCOPE</text>
  <text x="400" y="125" fill="rgba(247,245,240,.55)" font-family="monospace" font-size="10">PERMISSION</text>
